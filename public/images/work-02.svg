<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-label="Helix Studio — identity and UI">
  <defs>
    <linearGradient id="w2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0c10"/><stop offset="1" stop-color="#060608"/>
    </linearGradient>
    <radialGradient id="w2glow" cx="30%" cy="30%" r="65%">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.20"/><stop offset="62%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w2red" cx="82%" cy="86%" r="55%">
      <stop offset="0" stop-color="#e23b16" stop-opacity="0.15"/><stop offset="70%" stop-color="#e23b16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1100" fill="url(#w2bg)"/>
  <rect width="900" height="1100" fill="url(#w2glow)"/>
  <rect width="900" height="1100" fill="url(#w2red)"/>

  <!-- concentric rotated marks -->
  <g transform="translate(450 470)" fill="none" stroke="#c9a84c">
    <rect x="-190" y="-190" width="380" height="380" rx="24" stroke-opacity="0.18"/>
    <rect x="-150" y="-150" width="300" height="300" rx="20" stroke-opacity="0.30" transform="rotate(15)"/>
    <rect x="-110" y="-110" width="220" height="220" rx="16" stroke-opacity="0.5" transform="rotate(30)"/>
    <circle r="60" stroke-opacity="0.8"/>
  </g>
  <!-- monogram H -->
  <g transform="translate(450 470)" fill="#f0efe9" fill-opacity="0.92">
    <rect x="-34" y="-46" width="16" height="92" rx="3"/>
    <rect x="18" y="-46" width="16" height="92" rx="3"/>
    <rect x="-34" y="-8" width="68" height="16" rx="3"/>
  </g>

  <!-- baseline grid ticks -->
  <g stroke="#f0efe9" stroke-opacity="0.10">
    <line x1="150" y1="740" x2="750" y2="740"/>
    <line x1="150" y1="736" x2="150" y2="744"/><line x1="300" y1="736" x2="300" y2="744"/>
    <line x1="450" y1="736" x2="450" y2="744"/><line x1="600" y1="736" x2="600" y2="744"/><line x1="750" y1="736" x2="750" y2="744"/>
  </g>
  <!-- colour swatches -->
  <g>
    <circle cx="360" cy="800" r="26" fill="#c9a84c"/>
    <circle cx="430" cy="800" r="26" fill="#f0efe9"/>
    <circle cx="500" cy="800" r="26" fill="#e23b16" fill-opacity="0.85"/>
    <circle cx="570" cy="800" r="26" fill="#16161c" stroke="#f0efe9" stroke-opacity="0.2"/>
  </g>

  <text x="150" y="900" font-family="'Space Grotesk','Arial',sans-serif" font-weight="700" font-size="30" letter-spacing="6" fill="#f0efe9" fill-opacity="0.9">HELIX STUDIO</text>
  <text x="150" y="940" font-family="'Inter','Arial',sans-serif" font-size="20" letter-spacing="2" fill="#c9a84c">IDENTITY · UI</text>
</svg>
