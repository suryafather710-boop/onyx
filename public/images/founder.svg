<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-label="Founder portrait placeholder">
  <defs>
    <radialGradient id="fd-glow" cx="50%" cy="34%" r="72%">
      <stop offset="0" stop-color="#e23b16" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#7a1408" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0304"/>
    </radialGradient>
    <linearGradient id="fd-fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140708"/><stop offset="1" stop-color="#050203"/>
    </linearGradient>
  </defs>
  <rect width="720" height="900" fill="#0a0304"/>
  <rect width="720" height="900" fill="url(#fd-glow)"/>
  <!-- silhouette -->
  <g fill="url(#fd-fig)">
    <circle cx="360" cy="360" r="150"/>
    <path d="M150 900c0-160 94-300 210-300s210 140 210 300z"/>
  </g>
  <!-- rim light -->
  <path d="M235 300a150 150 0 0 1 250 0" fill="none" stroke="#ff7a4d" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round"/>
  <text x="360" y="860" text-anchor="middle" font-family="'Inter','Arial',sans-serif" font-size="16" letter-spacing="4" fill="#f7f2ee" opacity="0.3">ADD founder.jpg</text>
</svg>
