<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-label="Growth and Automation">
  <defs>
    <linearGradient id="sg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111015"/><stop offset="1" stop-color="#060608"/>
    </linearGradient>
    <radialGradient id="sg-glow" cx="72%" cy="24%" r="60%">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.28"/><stop offset="60%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sg-red" cx="18%" cy="90%" r="55%">
      <stop offset="0" stop-color="#e23b16" stop-opacity="0.18"/><stop offset="70%" stop-color="#e23b16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sg-line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.5"/><stop offset="1" stop-color="#f0d78a"/>
    </linearGradient>
    <linearGradient id="sg-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.22"/><stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1254" height="1254" fill="url(#sg-bg)"/>
  <rect width="1254" height="1254" fill="url(#sg-glow)"/>
  <rect width="1254" height="1254" fill="url(#sg-red)"/>

  <!-- faint grid -->
  <g stroke="#f0efe9" stroke-opacity="0.05">
    <line x1="0" y1="420" x2="1254" y2="420"/><line x1="0" y1="640" x2="1254" y2="640"/><line x1="0" y1="860" x2="1254" y2="860"/>
  </g>

  <!-- ascending momentum curve with soft area fill -->
  <path d="M120 940 C 340 900, 430 720, 620 700 S 900 520, 1140 300 L1140 1000 L120 1000 Z" fill="url(#sg-area)"/>
  <path d="M120 940 C 340 900, 430 720, 620 700 S 900 520, 1140 300" fill="none" stroke="url(#sg-line)" stroke-width="6" stroke-linecap="round"/>

  <!-- automation nodes along the flow -->
  <g fill="#0f0e13" stroke="#c9a84c" stroke-width="3">
    <circle cx="120" cy="940" r="16"/>
    <circle cx="620" cy="700" r="16"/>
    <circle cx="1140" cy="300" r="20" fill="#c9a84c"/>
  </g>
  <g stroke="#c9a84c" stroke-opacity="0.35" stroke-dasharray="3 10" stroke-width="2">
    <line x1="620" y1="700" x2="620" y2="1000"/>
    <line x1="1140" y1="300" x2="1140" y2="1000"/>
  </g>

  <!-- glow around the peak node -->
  <circle cx="1140" cy="300" r="60" fill="#c9a84c" fill-opacity="0.12"/>
</svg>
