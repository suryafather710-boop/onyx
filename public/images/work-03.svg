<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-label="Nimbus SaaS — product and UX">
  <defs>
    <linearGradient id="w3bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0c10"/><stop offset="1" stop-color="#060608"/>
    </linearGradient>
    <radialGradient id="w3glow" cx="60%" cy="24%" r="60%">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.20"/><stop offset="62%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w3red" cx="16%" cy="88%" r="55%">
      <stop offset="0" stop-color="#e23b16" stop-opacity="0.14"/><stop offset="70%" stop-color="#e23b16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w3area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.35"/><stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1100" fill="url(#w3bg)"/>
  <rect width="900" height="1100" fill="url(#w3glow)"/>
  <rect width="900" height="1100" fill="url(#w3red)"/>

  <!-- dashboard panel -->
  <g transform="translate(140 300)">
    <rect x="0" y="0" width="620" height="500" rx="22" fill="#101016" stroke="#f0efe9" stroke-opacity="0.10"/>
    <!-- sidebar -->
    <rect x="0" y="0" width="120" height="500" rx="22" fill="#0b0b10"/>
    <rect x="28" y="40" width="64" height="12" rx="6" fill="#c9a84c"/>
    <rect x="28" y="90" width="64" height="10" rx="5" fill="#f0efe9" fill-opacity="0.25"/>
    <rect x="28" y="120" width="64" height="10" rx="5" fill="#f0efe9" fill-opacity="0.18"/>
    <rect x="28" y="150" width="64" height="10" rx="5" fill="#f0efe9" fill-opacity="0.18"/>
    <!-- stat tiles -->
    <rect x="150" y="36" width="130" height="86" rx="10" fill="#16161c"/>
    <rect x="300" y="36" width="130" height="86" rx="10" fill="#16161c"/>
    <rect x="450" y="36" width="130" height="86" rx="10" fill="#16161c"/>
    <rect x="168" y="58" width="60" height="14" rx="7" fill="#f0efe9" fill-opacity="0.55"/>
    <rect x="318" y="58" width="60" height="14" rx="7" fill="#f0efe9" fill-opacity="0.55"/>
    <rect x="468" y="58" width="60" height="14" rx="7" fill="#c9a84c"/>
    <rect x="168" y="88" width="40" height="10" rx="5" fill="#f0efe9" fill-opacity="0.2"/>
    <rect x="318" y="88" width="40" height="10" rx="5" fill="#f0efe9" fill-opacity="0.2"/>
    <rect x="468" y="88" width="40" height="10" rx="5" fill="#f0efe9" fill-opacity="0.2"/>
    <!-- chart -->
    <g transform="translate(150 150)">
      <path d="M0 250 L0 190 L90 150 L180 175 L270 95 L360 120 L430 40 L430 250 Z" fill="url(#w3area)"/>
      <path d="M0 190 L90 150 L180 175 L270 95 L360 120 L430 40" fill="none" stroke="#c9a84c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="430" cy="40" r="7" fill="#c9a84c"/>
      <g stroke="#f0efe9" stroke-opacity="0.08"><line x1="0" y1="60" x2="430" y2="60"/><line x1="0" y1="130" x2="430" y2="130"/><line x1="0" y1="200" x2="430" y2="200"/></g>
    </g>
  </g>

  <text x="150" y="900" font-family="'Space Grotesk','Arial',sans-serif" font-weight="700" font-size="30" letter-spacing="6" fill="#f0efe9" fill-opacity="0.9">NIMBUS SAAS</text>
  <text x="150" y="940" font-family="'Inter','Arial',sans-serif" font-size="20" letter-spacing="2" fill="#c9a84c">PRODUCT · UX</text>
</svg>
